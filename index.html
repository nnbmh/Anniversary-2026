<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#02040a">

  <title>Our Little Universe</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <!-- =========================================
         UNIVERSE
    ========================================== -->

    <div id="universe">

      <!-- Realistic photographic sky -->
      <div id="spaceBackground"></div>
      
      <!-- Background atmospheric glow -->
      <div class="space-haze haze-a"></div>
      <div class="space-haze haze-b"></div>
      <div class="space-haze haze-c"></div>

      <!-- Different depth layers -->
      <div
        id="starsFar"
        class="star-layer stars-far"
      ></div>

      <div
        id="starsMid"
        class="star-layer stars-mid"
      ></div>

      <div
        id="starsNear"
        class="star-layer stars-near"
      ></div>


      <!-- =====================================
           TEMPORARY ORION
           This is only our navigation reference.
      ====================================== -->

      <section
        id="orion"
        class="constellation"
        aria-label="Orion"
      >

        <svg
          class="constellation-lines"
          viewBox="0 0 500 620"
          aria-hidden="true"
        >

          <line x1="145" y1="115" x2="355" y2="145"></line>

          <line x1="145" y1="115" x2="205" y2="275"></line>
          <line x1="355" y1="145" x2="295" y2="285"></line>

          <line x1="205" y1="275" x2="250" y2="280"></line>
          <line x1="250" y1="280" x2="295" y2="285"></line>

          <line x1="205" y1="275" x2="165" y2="495"></line>
          <line x1="295" y1="285" x2="365" y2="500"></line>

          <line x1="250" y1="280" x2="248" y2="350"></line>
          <line x1="248" y1="350" x2="245" y2="400"></line>

        </svg>


        <!-- Betelgeuse -->
        <span
          class="constellation-star star-large star-warm"
          style="left:29%; top:18.5%;"
        ></span>

        <!-- Bellatrix -->
        <span
          class="constellation-star star-large"
          style="left:71%; top:23.5%;"
        ></span>

        <!-- Belt -->
        <span
          class="constellation-star"
          style="left:41%; top:44.4%;"
        ></span>

        <span
          class="constellation-star"
          style="left:50%; top:45.2%;"
        ></span>

        <span
          class="constellation-star"
          style="left:59%; top:46%;"
        ></span>

        <!-- Sword -->
        <span
          class="constellation-star star-small"
          style="left:49.6%; top:56.5%;"
        ></span>

        <span
          class="constellation-star star-small"
          style="left:49%; top:64.5%;"
        ></span>

        <!-- Saiph -->
        <span
          class="constellation-star star-large"
          style="left:33%; top:80%;"
        ></span>

        <!-- Rigel -->
        <span
          class="constellation-star star-large star-blue"
          style="left:73%; top:80.5%;"
        ></span>


        <div class="constellation-label">
          <span>ORION</span>
          <small>The Beginning</small>
        </div>

      </section>

    </div>


    <!-- =========================================
         INTERFACE
    ========================================== -->

    <header id="interface">

      <div class="site-title">
        OUR LITTLE UNIVERSE
      </div>

      <button
        id="homeButton"
        type="button"
        aria-label="Return to Orion"
      >
        <span class="home-symbol">✦</span>
        <span class="home-text">ORION</span>
      </button>

    </header>


    <!-- First-time navigation hint -->

    <div id="navigationHint">

      <div class="hint-line"></div>

      <p>
        Drag to explore
      </p>

      <span>
        Pinch or scroll to travel through the stars
      </span>

    </div>


    <!-- Zoom indicator -->

    <div id="zoomDisplay">

      <span class="zoom-label">
        DEPTH
      </span>

      <div class="zoom-track">
        <div id="zoomFill"></div>
      </div>

    </div>


    <!-- Edge vignette -->

    <div id="vignette"></div>

  </main>


  <script src="main.js"></script>

</body>
</html>
