<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#010309"
  >

  <title>Our Little Universe</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main id="app">

    <!-- ================================================
         UNIVERSE
    ================================================= -->

    <div id="universe">

      <!-- SPACE DUST -->

      <div id="dustLayer">

        <div class="dust dust-a"></div>
        <div class="dust dust-b"></div>
        <div class="dust dust-c"></div>
        <div class="dust dust-d"></div>

      </div>


      <!-- PROCEDURAL STAR LAYERS -->

      <div
        id="starsDeep"
        class="star-layer"
      ></div>

      <div
        id="starsFar"
        class="star-layer"
      ></div>

      <div
        id="starsMid"
        class="star-layer"
      ></div>

      <div
        id="starsNear"
        class="star-layer"
      ></div>


      <!-- ================================================
           ORION
      ================================================= -->

      <section
        id="orion"
        class="constellation"
        aria-label="Orion constellation"
      >

        <canvas
          id="orionStarCanvas"
          class="orion-star-canvas"
          aria-hidden="true"
      ></canvas>

        <!-- constellation lines -->

        <svg
          class="constellation-lines"
          viewBox="0 0 500 620"
          aria-hidden="true"
        >

          <!-- shoulders -->

          <line
            x1="145"
            y1="115"
            x2="355"
            y2="145"
          ></line>


          <!-- left shoulder to belt -->

          <line
            x1="145"
            y1="115"
            x2="205"
            y2="275"
          ></line>


          <!-- right shoulder to belt -->

          <line
            x1="355"
            y1="145"
            x2="295"
            y2="285"
          ></line>


          <!-- belt -->

          <line
            x1="205"
            y1="275"
            x2="250"
            y2="280"
          ></line>

          <line
            x1="250"
            y1="280"
            x2="295"
            y2="285"
          ></line>


          <!-- legs -->

          <line
            x1="205"
            y1="275"
            x2="165"
            y2="495"
          ></line>

          <line
            x1="295"
            y1="285"
            x2="365"
            y2="500"
          ></line>


          <!-- sword -->

          <line
            x1="250"
            y1="280"
            x2="248"
            y2="350"
          ></line>

          <line
            x1="248"
            y1="350"
            x2="245"
            y2="400"
          ></line>

        </svg>


        <!-- ================================================
             INDIVIDUAL ORION STARS

             Each star now has its OWN CLASS.
             Their sizes are controlled independently in CSS.
        ================================================= -->


        <!-- Betelgeuse -->

        <span
          class="
            orion-star
            warm
            star-betelgeuse
          "
          style="
            left:29%;
            top:18.5%;
          "
        ></span>


        <!-- Bellatrix -->

        <span
          class="
            orion-star
            star-bellatrix
          "
          style="
            left:71%;
            top:23.5%;
          "
        ></span>


        <!-- Alnitak -->

        <span
          class="
            orion-star
            star-alnitak
          "
          style="
            left:41%;
            top:44.4%;
          "
        ></span>


        <!-- Alnilam -->

        <span
          class="
            orion-star
            star-alnilam
          "
          style="
            left:50%;
            top:45.2%;
          "
        ></span>


        <!-- Mintaka -->

        <span
          class="
            orion-star
            star-mintaka
          "
          style="
            left:59%;
            top:46%;
          "
        ></span>


        <!-- Sword 1 -->

        <span
          class="
            orion-star
            small
            star-sword-1
          "
          style="
            left:49.6%;
            top:56.5%;
          "
        ></span>


        <!-- Sword 2 -->

        <span
          class="
            orion-star
            small
            star-sword-2
          "
          style="
            left:49%;
            top:64.5%;
          "
        ></span>


        <!-- Saiph -->

        <span
          class="
            orion-star
            star-saiph
          "
          style="
            left:33%;
            top:80%;
          "
        ></span>


        <!-- Rigel -->

        <span
          class="
            orion-star
            cool
            star-rigel
          "
          style="
            left:73%;
            top:80.5%;
          "
        ></span>


        <!-- LABEL -->

        <div class="constellation-label">

          <span class="constellation-name">
            ORION
          </span>

          <span class="constellation-subtitle">
            The Beginning
          </span>

        </div>

      </section>

    </div>


    <!-- ================================================
         TOP INTERFACE
    ================================================= -->

    <div id="interface">

      <div class="site-title">
        OUR LITTLE UNIVERSE
      </div>

      <div id="discoveryCounter">

        <span id="discoveryNumber">
          0
        </span>

        <span class="counter-divider">
          /
        </span>

        <span>
          5
        </span>

        <small>
          DISCOVERED
        </small>

      </div>

    </div>


    <!-- ================================================
         TELESCOPE
    ================================================= -->

    <div
      id="telescopeView"
      aria-hidden="true"
    >

      <div id="eyepiece">

        <canvas
          id="telescopeCanvas"
        ></canvas>

        <div
          class="eyepiece-optics"
        ></div>

      </div>


      <div class="telescope-instruction">

        <span>
          MOVE THROUGH THE SKY
        </span>

        <small>
          drag to search
        </small>

      </div>

    </div>


    <!-- ================================================
         TELESCOPE BUTTON
    ================================================= -->

    <button
      id="telescopeButton"
      type="button"
      aria-label="Toggle telescope"
    >

      <span class="telescope-icon">
        ◉
      </span>

      <span class="telescope-text">
        TELESCOPE
      </span>

    </button>


    <!-- ================================================
         NAVIGATION HINT
    ================================================= -->

    <div id="navigationHint">

      <p>
        Drag to explore
      </p>

      <span>
        Pinch or scroll to zoom
      </span>

    </div>


    <!-- ================================================
         DISCOVERY MESSAGE
    ================================================= -->

    <div id="discoveryMessage">

      <span class="discovery-eyebrow">
        CONSTELLATION DISCOVERED
      </span>

      <strong>
        ORION
      </strong>

      <small>
        The Beginning
      </small>

    </div>


    <div id="vignette"></div>

  </main>


  <script src="main.js"></script>

</body>

</html>
